plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.141'
	id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
	srcDir('src/generated/resources')

	exclude("**/*.bbmodel")
	exclude("src/generated/**/.cache")
}

repositories {
	// Minecraft 官方库 - 提供 Minecraft 相关依赖
	maven { url = "https://libraries.minecraft.net/" }

	// NeoForge 官方发布仓库 - NeoForge 核心依赖和元数据
	maven { url = "https://neoforged.forgecdn.net/releases" }
	maven { url = "https://neoforged.forgecdn.net/mojang-meta" }

	// 本地 Maven 仓库和中央仓库 - 基础依赖源
	mavenLocal()
	mavenCentral()
	// GeckoLib 仓库 - GeckoLib 动画库（用于实体动画渲染）
	maven {
		url = uri("https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/")
		content { includeGroup("software.bernie.geckolib") }
	}
	// LatvianDev 仓库 - KubeJS、Rhino 等脚本模组（LatvianModder 组织）
	maven {
		url "https://maven.latvian.dev/releases"
		content {
			includeGroup "dev.latvian.mods"
			includeGroup "dev.latvian.apps"
		}
	}
	// Modrinth 仓库 - Modrinth 平台发布的模组（如 EpicFight、Spark、Jade 等）
	maven { url = uri("https://api.modrinth.com/maven") }

	// BlameJared 仓库 - CraftTweaker、JEI 等相关工具库
	maven { url = uri("https://maven.blamejared.com/") }

	// JitPack - GitHub 项目构建仓库（通用）
	maven { url = 'https://jitpack.io' }

	// KotlinForForge 仓库 - Kotlin 在 NeoForge 上的支持库
	maven {
		name = "Kotlin for Forge"
		url = "https://thedarkcolour.github.io/KotlinForForge/"
		content { includeGroup "thedarkcolour" }
	}
}

base {
	archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
	interfaceInjectionData.from "interfaces.json"
	interfaceInjectionData {
		publish file("interfaces.json")
	}

	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		client {
			client()

			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		data {
			data()

			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			systemProperty 'forge.logging.console.level', 'debug'

			jvmArguments.addAll([
							// 忽略无效指令，避免有的人没安装 JetBrain Runtime 无法启动游戏
							"-XX:+IgnoreUnrecognizedVMOptions",
							// 启用 JetBrain Runtime 热重载功能
							"-XX:+AllowEnhancedClassRedefinition"])

			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	implementation "net.neoforged:neoforge:${neo_version}"
	localRuntime "org.javassist:javassist:3.30.2-GA"

	// MixinSquared
	compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
	implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinsquared_version}"))

	// geckolib
	implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

	// Jade
	implementation "maven.modrinth:jade:${jade_version}+neoforge"

	// JEI
	compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
	compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
	localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

	// Kotlin
	implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib"
	compileOnly "org.jetbrains.kotlin:kotlin-reflect"
	compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
					minecraft_version      : minecraft_version,
					minecraft_version_range: minecraft_version_range,
					neo_version            : neo_version,
					loader_version_range   : loader_version_range,
					mod_id                 : mod_id,
					mod_name               : mod_name,
					mod_license            : mod_license,
					mod_version            : mod_version,
					mod_authors    : mod_authors,
					mod_description: mod_description,
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/repo"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
